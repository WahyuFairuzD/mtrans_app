name: mtrans_wash
description: "Aplikasi operasional cuci bus Mtrans."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  camera: 0.12.0+2
  geolocator: 14.1.2
  image: ^4.3.0

  pdf: ^3.11.0
  excel: ^4.0.6
  signature: ^6.0.0
  share_plus: ^13.0.0

  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mtrans.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mtrans.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/